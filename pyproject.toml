[project]
name = "research-canvas"
version = "0.1.0"
description = "Deep Research - an infinite canvas for reading a document and asking questions to any depth."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "markdown-it-py>=3.0",
    "linkify-it-py>=2.0",
    "mdit-py-plugins>=0.4",
    "pydantic>=2.9",
    "latex2mathml>=3.81.1",
]

[project.scripts]
research-canvas = "research_canvas.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-playwright>=0.5",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_canvas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # so tests/ shares fixtures by import, not by path juggling
asyncio_mode = "auto"
markers = [
    "e2e: browser tests that need a live server",
    "live: tests that spend real Claude usage",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
